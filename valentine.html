<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Will You Be My Valentine?</title>
<style>
    body {
        background: linear-gradient(135deg, #ff4d6d, #ff8fa3);
        font-family: Arial, sans-serif;
        text-align: center;
        color: white;
        height: 100vh;
        margin: 0;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }

    h1 {
        font-size: 38px;
    }

    .buttons {
        margin-top: 40px;
        position: relative;
        width: 100%;
        height: 300px;
    }

    button {
        position: absolute;
        background-color: white;
        color: #ff4d6d;
        border: none;
        padding: 15px 25px;
        font-size: 18px;
        border-radius: 25px;
        cursor: pointer;
        transition: 0.2s;
    }

    #yesBtn {
        left: 40%;
        top: 120px;
    }

    #otherBtn {
        left: 55%;
        top: 120px;
    }

    #message {
        margin-top: 40px;
        font-size: 20px;
        max-width: 600px;
        opacity: 0;
        transition: opacity 1.5s ease;
    }

    .show {
        opacity: 1 !important;
    }
</style>
</head>
<body>

<h1>Doha ❤️<br>Will you be my Valentine?</h1>
<p>— Marouane</p>

<div class="buttons">
    <button id="yesBtn" onclick="showMessage()">Yes 💕</button>
    <button id="otherBtn">Yes walakin f blassa akhra 😏</button>
</div>

<div id="message"></div>

<script>
const otherBtn = document.getElementById("otherBtn");
const message = document.getElementById("message");

function moveButton() {
    const maxX = window.innerWidth - otherBtn.offsetWidth;
    const maxY = window.innerHeight - otherBtn.offsetHeight;

    const randomX = Math.random() * maxX;
    const randomY = Math.random() * maxY;

    otherBtn.style.left = randomX + "px";
    otherBtn.style.top = randomY + "px";
}

otherBtn.addEventListener("mouseover", moveButton);
otherBtn.addEventListener("click", moveButton);

// It also moves randomly every second 😈
setInterval(moveButton, 1000);

function showMessage() {
    message.innerHTML = "Doha ❤️<br><br>From the moment you came into my life, everything feels softer and brighter. You have this calm, beautiful energy that makes every moment special. I don’t just want you for Valentine’s Day… I want your smile, your laugh, and your presence in my life for as long as you'll let me. 🌹✨<br><br>So officially… will you be my Valentine? 💌";
    message.classList.add("show");
}
</script>

</body>
</html>
